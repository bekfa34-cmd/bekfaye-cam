<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bek. Faye">
<meta name="theme-color" content="#0c0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css">
<title>Bek. Faye</title>
</head>
<body>
<div id="app" data-tab="west">
  <header id="top">
    <nav id="tabs" aria-label="Mode">
      <button data-t="west" class="on">WEST</button>
      <button data-t="vhs">VHS</button>
      <button data-t="mosh">MOSH</button>
    </nav>
    <button id="gear" aria-label="Settings">&#9881;&#xFE0E;</button>
  </header>

  <div id="tc"><i class="rec"></i><span id="tcTime">00:00:00:00</span><span id="tcInfo"></span></div>

  <main id="stage">
    <canvas id="cam"></canvas>
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="msg" hidden></div>
    <div id="flash"></div>
    <div id="count" hidden></div>
    <div id="zr"></div>
    <button id="key" hidden>Key: off</button>
  </main>

  <section id="lower">
    <div id="strip" aria-label="Looks"></div>
    <div id="dock">
      <div id="zoom"><button data-z="0.5" hidden>.5</button><button data-z="1" class="on">1&times;</button><button data-z="2">2&times;</button><button data-z="3">3&times;</button></div>
      <div id="mode"><button data-m="photo">Photo</button><button data-m="video" class="on">Video</button></div>
    </div>
    <div id="row">
      <button id="roll" aria-label="Roll"><img id="rollImg" alt=""><b id="rollN"></b></button>
      <button id="shutter" aria-label="Record"><i></i></button>
      <div id="side">
        <button id="plus" aria-label="Mosh editor" hidden>+</button>
        <button id="import" aria-label="Choose video" hidden>Import</button>
        <button id="flip" aria-label="Flip camera">&#8635;</button>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="video/*" hidden>

<!-- settings -->
<div class="sheet" id="settings" hidden>
  <div class="card">
    <div class="bar"><b>Settings</b><button class="x" data-close>Done</button></div>
    <div class="body">
      <label class="r"><span>Quality</span><button id="s-tier" class="pill"></button></label>
      <label class="r"><span>Codec</span><select id="s-codec"><option value="auto">Auto</option><option value="hevc">HEVC</option><option value="h264">H.264</option></select></label>
      <label class="r"><span>WEST shape</span><select id="s-westRatio"><option value="full">Full</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="1:1">1:1</option></select></label>
      <label class="r"><span>VHS shape</span><select id="s-vhsRatio"><option value="4:3">Standard 3:4</option><option value="16:9">Tall 9:16</option></select></label>
      <label class="r"><span>VHS date stamp</span><select id="s-stampMode"><option value="off">Off</option><option value="now">Now</option><option value="custom">Custom date</option></select></label>
      <label class="r" id="r-custom"><span>Stamp date</span><input type="datetime-local" id="s-customDate"></label>
      <label class="r"><span>Stamp style</span><select id="s-stampStyle"><option value="classic">Classic</option><option value="tall">Tall</option><option value="alt">Alt</option></select></label>
      <label class="r"><span>Stamp on right</span><input type="checkbox" id="s-stampRight"></label>
      <label class="r"><span>Tape sound (VHS)</span><input type="checkbox" id="s-tape"></label>
      <label class="r"><span>Shake adds tracking noise</span><input type="checkbox" id="s-shake"></label>
      <p class="foot" id="ver"></p>
    </div>
  </div>
</div>

<!-- roll -->
<div class="sheet" id="rollSheet" hidden>
  <div class="card tall">
    <div class="bar"><b id="rollTitle">Roll</b><span><button class="x" id="rollSel">Select</button><button class="x" data-close>Done</button></span></div>
    <div class="body"><div id="rollGrid"></div><p id="rollEmpty" class="foot">Nothing yet.</p></div>
    <div class="acts"><button class="btn" id="rollSave">Save all</button><button class="btn ghost" id="rollDel">Clear roll</button></div>
  </div>
</div>

<!-- viewer for one roll item -->
<div class="sheet" id="viewer" hidden>
  <div class="card tall">
    <div class="media" id="viewMedia"></div>
    <div class="acts"><button class="btn" id="viewSave">Save</button><button class="btn ghost" id="viewDel">Delete</button><button class="btn ghost" data-close>Close</button></div>
  </div>
</div>

<!-- mosh review: loops the clip just recorded -->
<div class="sheet" id="review" hidden>
  <div class="card tall">
    <div class="media" id="reviewMedia"></div>
    <div class="acts"><button class="btn" id="reviewSave">Save</button><button class="btn ghost" id="reviewTrash">Trash</button></div>
  </div>
</div>

<div id="editorRoot"></div>
<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
