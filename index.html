<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bek. Faye">
<meta name="theme-color" content="#53393A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css">
<title>Bek. Faye</title>
</head>
<body>
<div id="app" data-tab="west">
  <header id="top">
    <b id="mark">bek. faye</b>
    <nav id="tabs" aria-label="Mode">
      <button data-t="west" class="on">WEST</button>
      <button data-t="vhs">VHS</button>
      <button data-t="mosh">MOSH</button>
    </nav>
    <button id="gear" aria-label="Settings">SET</button>
  </header>

  <div id="tc"><i class="rec"></i><span id="tcTime">00:00:00:00</span><span id="tcInfo"></span></div>

  <main id="stage">
    <canvas id="cam"></canvas>
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="msg" hidden></div>
    <div id="flash"></div>
    <div id="zr"></div>
    <div id="hud" hidden><i></i><span id="hudTxt"></span></div>
    <div id="ring"></div>
    <div id="keyBox" hidden><button id="key">KEY: OFF</button><span id="keyCap"></span></div>
  </main>

  <section id="lower">
    <div id="strip" aria-label="Looks"></div>
    <div id="dock">
      <div id="zoom"><button data-z="0.5" hidden>.5</button><button data-z="1" class="on">1&times;</button><button data-z="2">2&times;</button><button data-z="3">3&times;</button></div>
      <div id="mode"><button data-m="photo">Photo</button><button data-m="video" class="on">Video</button></div>
    </div>
    <div id="row">
      <button id="roll" aria-label="Roll"><img id="rollImg" alt=""><b id="rollN"></b></button>
      <button id="shutter" aria-label="Record"><i></i></button>
      <div id="side">
        <button id="plus" aria-label="Mosh editor" hidden>+</button>
        <button id="import" aria-label="Choose video" hidden>Import</button>
        <button id="flip" aria-label="Flip camera">&#8635;</button>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="video/*" hidden>

<!-- settings -->
<div class="sheet" id="settings" hidden>
  <div class="card">
    <div class="bar"><b>Settings</b><button class="x" data-close>Done</button></div>
    <div class="body">
      <div class="r col"><span>Quality</span><button id="s-tier" class="pill"></button><p class="hint" id="s-tierNote"></p></div>
      <div class="r col"><span>Codec</span><div class="seg" data-k="codec"><button data-v="auto">Auto</button><button data-v="hevc">HEVC</button><button data-v="h264">H.264</button></div></div>
      <div class="r col"><span>WEST shape</span><div class="seg" data-k="westRatio"><button data-v="full">Full</button><button data-v="4:3">4:3</button><button data-v="16:9">16:9</button><button data-v="1:1">1:1</button></div></div>
      <div class="r col"><span>VHS shape</span><div class="seg" data-k="vhsRatio"><button data-v="4:3">4:3 classic</button><button data-v="16:9">16:9 wide</button></div><p class="hint">Held upright these record as 3:4 and 9:16.</p></div>
      <label class="r"><span>Tape sound (VHS)</span><input type="checkbox" id="s-tape"></label>
      <label class="r"><span>Shake adds tracking noise</span><input type="checkbox" id="s-shake"></label>
      <p class="foot"><b>bek. faye</b><br><span id="ver"></span></p>
    </div>
  </div>
</div>

<!-- roll -->
<div class="sheet" id="rollSheet" hidden>
  <div class="card tall">
    <div class="bar"><b id="rollTitle">Roll</b><span><button class="x" id="rollSel">Select</button><button class="x" data-close>Done</button></span></div>
    <div class="body"><div id="rollGrid"></div><div id="rollEmpty"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="7" y="9" width="34" height="30"/><circle cx="18" cy="20" r="3"/><path d="M7 33l11-9 8 7 6-5 9 8"/></svg><p>Nothing yet</p></div></div>
    <div class="acts"><button class="btn" id="rollSave">Save all</button><button class="btn ghost" id="rollDel">Clear roll</button></div>
  </div>
</div>

<!-- viewer for one roll item -->
<div class="sheet full" id="viewer" hidden>
  <div class="card tall">
    <div class="media" id="viewMedia"></div>
    <div class="acts"><button class="btn pinkline" id="viewSave">Save</button><button class="btn ghost" id="viewDel">Delete</button><button class="btn ghost" data-close>Close</button></div>
  </div>
</div>

<!-- mosh review: loops the clip just recorded -->
<div class="sheet full" id="review" hidden>
  <div class="card tall">
    <div class="media" id="reviewMedia"></div>
    <div class="acts"><button class="btn" id="reviewSave">Save</button><button class="btn ghost" id="reviewTrash">Trash</button></div>
  </div>
</div>

<div id="editorRoot"></div>
<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
